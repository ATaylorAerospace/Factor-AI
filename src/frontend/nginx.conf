# Serves the built dashboard and proxies /api to the backend container, so the
# browser can use the same relative /api/v1 URLs as the Vite dev proxy.
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 5g;  # batches of up to 100 files x 50 MB

    location /api/ {
        proxy_pass http://factor-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # Server-Sent Events: stream each event immediately and allow long analyses.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_request_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
